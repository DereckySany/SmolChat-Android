name: Build and Release Android APK

on:
  # Mantém o gatilho original para tags 'v*'
  push:
    tags:
      - 'v*'
  # Adiciona o gatilho manual com input
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Choose the build type'
        type: choice # Define como um seletor
        required: true
        default: 'release' # Valor padrão
        options: # Opções disponíveis
          - release
          - debug

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: 'true'

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c # Verifique se r27c é a versão desejada ou use 'latest'
          add-to-path: true
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      # Decodifica o keystore APENAS se for build 'release' (seja por tag ou manual)
      # Builds debug geralmente não precisam/usam o keystore de release
      - name: Decode keystore
        # Executa se for push de tag OU se for manual E o tipo escolhido for 'release'
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release')
        env:
          ENCODED_STRING: ${{ secrets.KEYSTORE_BASE_64 }}
        run: |
          echo "Decoding keystore for release build..."
          echo $ENCODED_STRING > keystore-b64.txt
          base64 -d keystore-b64.txt > keystore.jks
          # Mova ou configure o build.gradle para encontrar este arquivo, ex:
          # mv keystore.jks app/keystore.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Determine Build Task and Keystore Env Vars
        id: build_vars
        # Define qual tarefa Gradle usar e se deve passar variáveis do keystore
        run: |
          TASK_NAME=""
          PASS_KEYSTORE_ENV="false" # Flag para saber se passa env vars do keystore

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Manual trigger: Usa o input, capitaliza (release -> Release, debug -> Debug)
            SELECTED_TYPE="${{ github.event.inputs.build_type }}"
            TASK_NAME="assemble$(echo $SELECTED_TYPE | awk '{print toupper(substr($0,1,1)) tolower(substr($0,2))}')"
            if [[ "$SELECTED_TYPE" == "release" ]]; then
              PASS_KEYSTORE_ENV="true"
            fi
          elif [[ "${{ github.event_name }}" == "push" && startsWith(github.ref, 'refs/tags/') ]]; then
            # Tag push: Sempre release
            TASK_NAME="assembleRelease"
            PASS_KEYSTORE_ENV="true"
          else
            # Default para outros casos (se houver): Debug
            echo "Warning: Unknown trigger or non-tag push, defaulting to Debug build."
            TASK_NAME="assembleDebug"
          fi

          echo "Gradle task determined: $TASK_NAME"
          echo "::set-output name=gradle_task::$TASK_NAME"
          echo "::set-output name=use_keystore_env::$PASS_KEYSTORE_ENV"

      - name: Build APK
        env:
          # Passa as variáveis do Keystore SOMENTE se a etapa anterior determinou necessário
          RELEASE_KEYSTORE_PASSWORD: ${{ steps.build_vars.outputs.use_keystore_env == 'true' && secrets.RELEASE_KEYSTORE_PASSWORD || '' }}
          RELEASE_KEYSTORE_ALIAS: ${{ steps.build_vars.outputs.use_keystore_env == 'true' && secrets.RELEASE_KEYSTORE_ALIAS || '' }}
          RELEASE_KEY_PASSWORD: ${{ steps.build_vars.outputs.use_keystore_env == 'true' && secrets.RELEASE_KEY_PASSWORD || '' }}
        run: |
          echo "Running Gradle task: ${{ steps.build_vars.outputs.gradle_task }}"
          # Garanta que seu build.gradle esteja configurado para usar estas env vars OU
          # passe propriedades -PkeyAlias=... etc. condicionalmente se use_keystore_env for true
          ./gradlew ${{ steps.build_vars.outputs.gradle_task }} --stacktrace

      # --- Etapas de Release/Upload ---
      # Mantidas como antes, executando apenas para push de tags (portanto, sempre release)

      - name: Create a release
        if: startsWith(github.ref, 'refs/tags/') # Executa apenas se for um push de tag
        uses: actions/create-release@v1
        id: create_release
        with:
          tag_name: ${{ github.ref }}
          release_name: ${{ github.ref }}
          draft: false
          prerelease: false
          body_path: CHANGELOG.md # Garanta que este arquivo existe
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload APK to release
        if: startsWith(github.ref, 'refs/tags/') # Executa apenas se for um push de tag
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          # O caminho para o APK de release
          asset_path: app/build/outputs/apk/release/app-release.apk
          asset_name: SmolChat_${{ github.ref_name }}.apk # Usa o nome da tag no nome do arquivo
          asset_content_type: application/vnd.android.package-archive
